<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 20px; background: #F4F6F5; color: #13312E; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 17px; line-height: 26px;">
  <div style="display: flex; align-items: center; gap: 4px;">
    <a href="KidHome.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #13312E;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 28px; line-height: 34px;">Ask for money</h1>
  </div>

  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
    <legend style="font-size: 15px; line-height: 20px; font-weight: 700; padding: 0; margin-bottom: 8px;">From which jar?</legend>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <label style="min-height: 76px; border-radius: 14px; border: 3px solid #E2A81B; background: #FBEFCF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; box-sizing: border-box;">
        <input type="radio" name="jar" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">
        <strong>Spend</strong>
        <span class="num" style="font-size: 14px; line-height: 18px; color: #7A5200; font-weight: 700;">$15.25</span>
      </label>
      <label style="min-height: 76px; border-radius: 14px; border: 2px dashed #1F6F64; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;">
        <input type="radio" name="jar" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
        <strong>Save</strong>
        <span style="font-size: 13px; line-height: 18px; color: #155248;">You locked it</span>
      </label>
      <label style="min-height: 76px; border-radius: 14px; border: 1px solid #D3DCD9; background: #E9EEEC; color: #4F6460; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;">
        <input type="radio" name="jar" disabled style="position: absolute; opacity: 0; width: 1px; height: 1px;">
        <strong>Give</strong>
        <span style="font-size: 13px; line-height: 18px;">Parent lock</span>
      </label>
    </div>
  </fieldset>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <label for="req-amount" style="font-size: 15px; line-height: 20px; font-weight: 700;">How much?</label>
    <div style="display: flex; align-items: center; min-height: 76px; border: 2px solid #1F6F64; border-radius: 14px; padding: 0 18px; gap: 6px; background: #FFFFFF;">
      <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 36px; color: #4F6460;">$</span>
      <input id="req-amount" class="num" value="8.00" inputmode="decimal" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #13312E; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 40px;">
    </div>
    <span class="num" style="font-size: 14px; line-height: 20px; color: #4F6460;">You can ask for up to $15.25.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <label for="req-reason" style="font-size: 15px; line-height: 20px; font-weight: 700;">What’s it for?</label>
    <input id="req-reason" value="Movie with Jess" style="min-height: 52px; border: 1px solid #D3DCD9; border-radius: 8px; padding: 0 14px; font: inherit; color: #13312E; background: #FFFFFF;">
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <label for="req-goal" style="font-size: 15px; line-height: 20px; font-weight: 700;">For a goal? <span style="font-weight: 400; color: #4F6460;">(optional)</span></label>
    <select id="req-goal" style="min-height: 52px; border: 1px solid #D3DCD9; border-radius: 8px; padding: 0 12px; font: inherit; color: #13312E; background: #FFFFFF;">
      <option>No goal</option>
      <option>LEGO set</option>
      <option>Nintendo Switch</option>
    </select>
  </div>

  <div style="flex: 1;"></div>
  <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D3DCD9; font-size: 15px; line-height: 22px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F6F64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    <span>Your parents get a notification. <strong class="num">$8.00</strong> is held in Spend until they say yes or no.</span>
  </div>
  <button type="button" style="min-height: 60px; border: 0; border-radius: 14px; background: #E2A81B; color: #13312E; font: inherit; font-size: 19px; font-weight: 700;">Send request</button>
</div>
</x-dc>
