<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kid PIN sign-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F64}a:hover{color:#155248}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 32px 24px 28px; display: flex; flex-direction: column; align-items: center; gap: 24px; background: #F4F6F5; color: #13312E; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 17px; line-height: 26px;">
  <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center;">
    <a href="#" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      Not Ava?
    </a>
    <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 20px;">goldberry</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 8px;">
    <div style="width: 88px; height: 88px; border-radius: 28px; background: #E2A81B; color: #13312E; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 44px;">A</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 32px; line-height: 38px;">Hi, Ava</h1>
    <p style="margin: 0; color: #4F6460;">Type your PIN</p>
  </div>

  <div role="status" aria-label="{{filledLabel}}" style="display: flex; gap: 18px; height: 24px; align-items: center;">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
      <sc-if value="{{d.on}}" hint-placeholder-val="{{false}}">
        <div style="width: 20px; height: 20px; border-radius: 999px; background: #1F6F64;"></div>
      </sc-if>
      <sc-if value="{{d.off}}" hint-placeholder-val="{{true}}">
        <div style="width: 20px; height: 20px; border-radius: 999px; border: 3px solid #1F6F64; box-sizing: border-box;"></div>
      </sc-if>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 294px; margin-top: 8px;">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="9">
      <button type="button" onClick="{{k.press}}" style="height: 72px; border-radius: 20px; border: 1px solid #D3DCD9; background: #FFFFFF; color: #13312E; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 32px;">{{k.label}}</button>
    </sc-for>
    <div></div>
    <button type="button" onClick="{{zero}}" style="height: 72px; border-radius: 20px; border: 1px solid #D3DCD9; background: #FFFFFF; color: #13312E; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 32px;">0</button>
    <button type="button" onClick="{{back}}" aria-label="Delete last digit" style="height: 72px; border-radius: 20px; border: 0; background: transparent; color: #13312E; display: flex; align-items: center; justify-content: center;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="M17 9l-5 6M12 9l5 6"></path></svg>
    </button>
  </div>

  <div style="flex: 1;"></div>
  <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; color: #4F6460;">
    <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F6F64;">
    Remember this tablet for 30 days
  </label>
  <p style="margin: 0; font-size: 14px; line-height: 20px; color: #4F6460; text-align: center;">Forgot your PIN? Ask a parent to reset it.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pinLength":{"editor":"int","default":4,"min":4,"max":6},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pin: '' };
  }
  renderVals() {
    const len = this.props.pinLength ?? 4;
    const pin = this.state.pin;
    const add = (d) => () => { if (this.state.pin.length < len) this.setState({ pin: this.state.pin + d }); };
    const dots = [];
    for (let i = 0; i < len; i++) dots.push({ on: i < pin.length, off: i >= pin.length });
    const keys = ['1','2','3','4','5','6','7','8','9'].map((d) => ({ label: d, press: add(d) }));
    return {
      dots,
      keys,
      zero: add('0'),
      back: () => this.setState({ pin: this.state.pin.slice(0, -1) }),
      filledLabel: pin.length + ' of ' + len + ' digits entered'
    };
  }
}
</script>
</body>
</html>
