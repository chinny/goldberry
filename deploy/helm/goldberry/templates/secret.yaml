{{- $fullname := include "goldberry.fullname" . }}
{{- $needKey := not .Values.secretKey.existingSecret }}
{{- $needPG := and .Values.postgres.external.url (not .Values.postgres.external.existingSecret) }}
{{- if or $needKey $needPG }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname }}
{{- $old := "" }}
{{- if and $existing $existing.data }}{{ $old = index $existing.data "secret-key" | default "" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "goldberry.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needKey }}
  {{- /* Keep a generated key across upgrades: it decrypts stored SMTP secrets. */}}
  secret-key: {{ .Values.secretKey.value | default $old | default (randBytes 32) | b64enc | quote }}
  {{- end }}
  {{- if $needPG }}
  database-url: {{ .Values.postgres.external.url | b64enc | quote }}
  {{- end }}
{{- end }}
