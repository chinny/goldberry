version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are errcheck's job
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable:
    - gofmt
