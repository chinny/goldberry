name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - name: migration parity
        run: scripts/check-migrations.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test (SQLite, everything)
        if: matrix.db == 'sqlite'
        run: go test -race ./...
      - name: go test (store contract suite on Postgres)
        if: matrix.db == 'postgres'
        env:
          GOLDBERRY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -v -run 'TestContract|TestRebind' ./internal/store/postgres/...

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: build image and run the smoke test
        run: e2e/run-image.sh goldberry:ci
      - name: server log
        if: always()
        run: cat e2e/server.log || true

  helm:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: helm lint
        run: helm lint deploy/helm/goldberry --strict
      - name: chart refuses two replicas on SQLite
        run: |
          if helm template t deploy/helm/goldberry --set replicaCount=2 >/dev/null 2>&1; then
            echo "replicaCount=2 with SQLite should fail" >&2; exit 1
          fi
          helm template t deploy/helm/goldberry --set replicaCount=2 --set postgres.external.url=postgres://u:p@db/goldberry >/dev/null
      - uses: helm/kind-action@v1
      - name: build the image into kind
        run: |
          docker build -t goldberry:ci --build-arg COMMIT=${{ github.sha }} .
          kind load docker-image goldberry:ci --name chart-testing
      - name: install the chart
        run: |
          helm install gb deploy/helm/goldberry --wait --timeout 4m \
            --set image.repository=goldberry --set image.tag=ci --set image.pullPolicy=Never --set insecureCookies=true
      - name: smoke test the release
        run: |
          kubectl logs deploy/gb-goldberry | grep -q setup_token
          kubectl port-forward svc/gb-goldberry 18080:80 & sleep 3
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:18080/setup | grep -q 200
          # the SQLite file is on the PVC and writable by the nonroot user
          kubectl exec deploy/gb-goldberry -- /usr/local/bin/goldberry backup
      - name: diagnostics
        if: failure()
        run: kubectl describe pods; kubectl logs deploy/gb-goldberry --tail=100 || true
