name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
      - name: migration parity
        run: scripts/check-migrations.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test (SQLite, everything)
        if: matrix.db == 'sqlite'
        run: go test -race ./...
      - name: go test (store contract suite on Postgres)
        if: matrix.db == 'postgres'
        env:
          GOLDBERRY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -v -run 'TestContract|TestRebind' ./internal/store/postgres/...

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: build image and run the smoke test
        run: e2e/run-image.sh goldberry:ci
      - name: server log
        if: always()
        run: cat e2e/server.log || true

  ko:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.9
      - name: multi-arch build (amd64 + arm64, no push)
        env:
          VERSION: ci
          KO_DOCKER_REPO: ghcr.io/chinny/goldberry
        run: ko build --push=false ./cmd/goldberry
