name: release

# Releases come from release-please: merging its release PR tags vX.Y.Z and
# creates the GitHub Release, and this same run publishes. A pushed v* tag or
# a manual run (with a version) publishes too.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (creates tag v<version> on main if missing)"
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/goldberry
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: work out the version
        id: v
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) tag="v${{ inputs.version }}" ;;
            push) if [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then tag="${{ needs.release-please.outputs.tag_name }}"; else tag="${GITHUB_REF_NAME}"; fi ;;
          esac
          version="${tag#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $version" >&2; exit 1; }
          IFS=. read -r major minor _ <<< "$version"
          {
            echo "tag=$tag"; echo "version=$version"
            echo "tags=${IMAGE}:${version},${IMAGE}:${major}.${minor},${IMAGE}:${major},${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: tag and GitHub Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ steps.v.outputs.tag }}" --target "${GITHUB_SHA}" --title "${{ steps.v.outputs.tag }}" --generate-notes
          fi
          git fetch --tags
          git checkout "${{ steps.v.outputs.tag }}"
      - name: commit of the release
        id: c
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ steps.c.outputs.sha }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: goldberry-${{ steps.v.outputs.version }}.spdx.json
          upload-release-assets: false
      - uses: azure/setup-helm@v4
      - name: package and push the Helm chart
        run: |
          helm package deploy/helm/goldberry --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}"
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "goldberry-${{ steps.v.outputs.version }}.tgz" "${CHARTS}"
      - name: attach the SBOM and chart to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.v.outputs.tag }}" --title "${{ steps.v.outputs.tag }}" --generate-notes --verify-tag
          gh release upload "${{ steps.v.outputs.tag }}" --clobber \
            "goldberry-${{ steps.v.outputs.version }}.spdx.json" "goldberry-${{ steps.v.outputs.version }}.tgz"
      - name: summary
        run: |
          {
            echo "### Published ${{ steps.v.outputs.tag }}"
            echo "- Image: \`${IMAGE}:${{ steps.v.outputs.version }}\` (${{ steps.build.outputs.digest }}), signed with cosign"
            echo "- Chart: \`helm install goldberry ${CHARTS}/goldberry --version ${{ steps.v.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
